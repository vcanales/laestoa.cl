name = "laestoa"
main = "src/index.ts"
compatibility_date = "2026-08-26"

# workers.dev stays available as <worker>.<account-subdomain>.workers.dev.
workers_dev = true

# Custom domain: this Worker is the origin for laestoa.cl. No zone_id is required.
# Prerequisite: laestoa.cl must already be an active zone on this Cloudflare account.
# If deploy fails because the hostname has a CNAME, delete that record first
# (dashboard: DNS > Records), then redeploy. Do not invent a zone_id here.
# Dashboard alternative: Worker > Settings > Domains & Routes > Add > Custom Domain.
[[routes]]
pattern = "laestoa.cl"
custom_domain = true

# Zone DDoS mitigation is automatic once this Worker is routed on laestoa.cl.
# Bot Fight Mode is a dashboard setting and is not expressed here.

[[ratelimits]]
name = "CLI_RATE_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60
